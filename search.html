      (g._partial ? '<span class="sk" style="display:block;width:92%;height:12px;margin-top:12px"></span><span class="sk" style="display:block;width:64%;height:12px;margin-top:8px"></span><div class="dl" style="margin-top:12px"><span class="sk" style="width:96px;height:34px;border-radius:9px"></span><span class="sk" style="width:96px;height:34px;border-radius:9px"></span></div><span class="sk" style="display:block;width:120px;height:90px;border-radius:10px;margin-top:12px"></span>'
        : (introTxt ? '<div class="intro">' + esc(introTxt) + '</div>' : '')) +
      (g._partial ? '' : (dl ? '<div class="dl">' + dl + '</div>' : '')) +
      (g.img ? '<div class="img"><img class="s-img" src="' + esc(thumbOf(g.img)) + '" data-full="' + esc(g.img) + '" onerror="this.onerror=null;this.src=this.dataset.full" alt="" loading="lazy" data-t="' + esc(g.title) + '" data-p="' + esc(g.plat || '') + '" data-i="' + esc(introTxt) + '" data-u="' + esc(mz || '') + '" data-c="' + esc(zb || '') + '" data-z="' + esc(zz || '') + '"></div>' +
        '<span class="img-tip">点击图片查看完整介绍</span>' : '') +
      '</div>';
  }
  function setMore(show) {
    var b = document.getElementById('mrhx-more');
    if (b) b.style.display = show ? '' : 'none';
  }
  function renderMore() {
    var slice = _hits.slice(_page * ALL, (_page + 1) * ALL);
    resBox.insertAdjacentHTML('beforeend', slice.map(function (g) { return rowHtml(g, g._exact); }).join(''));
    // 「加载更多」必须始终待在列表最下面：新结果是用 beforeend 追加的，
    // 所以每轮渲染完要把按钮重新挪到末尾，否则点一次它就被顶到上面去了
    resBox.appendChild(moreWrap);
    _page++;
    setMore(_page * ALL < _hits.length);
  }
  var moreWrap = document.createElement('div');
  moreWrap.innerHTML = '<button id="mrhx-more" type="button" class="btn-dl btn-dl-m" style="border:none;cursor:pointer;padding:10px 28px;border-radius:9px;font-size:14px;font-weight:600">加载更多</button>';
  moreWrap.style.textAlign = 'center';
  moreWrap.style.marginTop = '6px';
  moreWrap.style.marginBottom = '6px';
  resBox.appendChild(moreWrap);
  document.getElementById('mrhx-more').onclick = renderMore;
  setMore(false);
  if (!q) { countEl.textContent = ''; resBox.innerHTML = '<div class="empty-box"><h3>请使用上方搜索框搜索游戏</h3><p>点顶部搜索图标，输入游戏名称或关键词即可搜索</p><a class="btn-dl btn-dl-m" href="index.html" style="border:none;cursor:pointer">回到首页</a></div>'; setMore(false); bindHistClick(); return; }
  // 2026-10-20 双层索引；2026-10-21 v2：大索引改为结果出来后再后台拉（不再与首屏抢带宽），
  // 进页先渲染骨架卡 + 扫光动效让用户看到「正在搜索」；小索引 0 结果或失败时回退整库匹配
  var kw = q.toLowerCase();
  function fuzzyMatch(text, pattern) {
    var t = (text || '').toLowerCase();
    var p = pattern.toLowerCase();
    if (t.indexOf(p) > -1) return true;
    var pi = 0;
    for (var ti = 0; ti < t.length && pi < p.length; ti++) {
      if (t[ti] === p[pi]) pi++;
    }
    return pi === p.length;
  }
  function matchScore(g) {
    var titleLower = (g.title || '').toLowerCase();
    var introLower = (g.intro || '').toLowerCase();
    if (titleLower === kw) return 0;
    if (titleLower.indexOf(kw) > -1) return 1;
    if (introLower.indexOf(kw) > -1) return 2;
    if (titleLower.indexOf(kw.split('').join('%')) > -1) return 3;
    return 4;
  }
  saveHist(q);
  var hw = document.getElementById('histWrap');
  if (hw) { hw.innerHTML = renderHist(); bindHistClick(); }
  var _shardCache = {};
  var SHARDS = 16; // 2026-10-21：大索引切 8 片（search_detail_0..15.json），补全只拉命中片，不再整库下载
  function loadShard(s) {
    if (!_shardCache[s]) _shardCache[s] = fetch('search_detail_' + s + '.json').then(function (r) { return r.json(); });
    return _shardCache[s];
  }
  function loadShards(list) {
    return Promise.all(list.map(loadShard)).then(function (arr) { return arr.reduce(function (a, b) { return a.concat(b); }, []); });
  }
  var _fullDone = false;
  var _errBox = '<div class="empty-box"><h3>搜索索引加载失败</h3><p>请检查网络后刷新页面</p><a class="btn-dl btn-dl-m" href="javascript:location.reload()" style="border:none;cursor:pointer">重新加载</a> <a class="btn-dl btn-dl-m" href="index.html" style="border:none;cursor:pointer;margin-left:6px">回到首页</a></div>';
  // 整库匹配（含介绍/放宽/推荐兜底）——小索引 0 结果或加载失败时走这里（拉全部分片拼回整库）
  function runFullSearch(data) {
    if (_fullDone) return;
    _fullDone = true;
    _hits = data.filter(function (g) {
      return fuzzyMatch(g.title, kw) || fuzzyMatch(g.intro, kw) || fuzzyMatch(g.plat, kw);
    });
    if (_hits.length) {
      _hits.sort(function (a, b) { return matchScore(a) - matchScore(b); });
      _hits.forEach(function (g) { g._exact = matchScore(g) <= 1; });
    }
    // 2026-10-19：0 结果兜底——字符乱序匹配（用户记错字序也能搜到），命中提示「已放宽匹配」
    var relaxed = false;
    if (!_hits.length && kw.length >= 2) {
      function looseMatch(text, pattern) {
        var t = (text || '').toLowerCase();
        var counts = {};
        for (var i = 0; i < t.length; i++) counts[t[i]] = (counts[t[i]] || 0) + 1;
        for (var j = 0; j < pattern.length; j++) {
          var ch = pattern[j];
          if (!counts[ch]) return false;
          counts[ch]--;
        }
        return true;
      }
      _hits = data.filter(function (g) { return looseMatch(g.title, kw); });
      if (_hits.length) { relaxed = true; _hits.forEach(function (g) { g._exact = false; }); }
    }
    countEl.textContent = '（找到 ' + _hits.length + ' 个' + (relaxed ? ' · 已放宽匹配' : '') + '）';
    if (!_hits.length) {
      // Show random recommended games
      var shuffled = data.slice().sort(function () { return 0.5 - Math.random(); });
      _hits = shuffled.slice(0, 12);
      _hits.forEach(function (g) { g._exact = false; });
      resBox.innerHTML = '<div class="empty-box"><h3>没有找到与「' + esc(kw) + '」相关的游戏</h3><p>为你推荐以下游戏</p></div>';
      renderMore();
      return;
    }
    _page = 0;
    resBox.innerHTML = '';
    renderMore();
  }
  // 小索引命中后，大索引到货把已渲染的卡片按 n（备用 url+标题）补全成完整版，保留页数与滚动位置
  function enrichWithFull(data) {
    if (!_hits.length || !_hits[0]._partial) return;
    var map = {};
    data.forEach(function (g) {
      if (g.n != null) map['n' + g.n] = g;
      map['u' + (g.url || '') + '|' + (g.title || '')] = g;
    });
    _hits = _hits.map(function (h) {
      var f = (h.n != null && map['n' + h.n]) || map['u' + (h.url || '') + '|' + (h.title || '')] || h;
      f._exact = h._exact;
      f._partial = false;
      return f;
    });
    var pages = _page, y = window.pageYOffset;
    _page = 0;
    resBox.innerHTML = '';
    for (var i = 0; i < pages; i++) renderMore();
    window.scrollTo(0, y);
  }
  function showErr() { resBox.innerHTML = _errBox; setMore(false); }
  // 骨架屏：先把标题/平台/介绍/按钮的轮廓摆好，扫光动效表示正在加载（不转圈）
  function skelRow() {
    return '<div class="result skel"><div class="rt"><span class="sk" style="width:38%;height:16px"></span><span class="sk" style="width:64px;height:20px;border-radius:99px"></span></div>' +
      '<span class="sk" style="display:block;width:92%;height:12px;margin-top:12px"></span>' +
      '<span class="sk" style="display:block;width:64%;height:12px;margin-top:8px"></span>' +
      '<div class="dl" style="margin-top:12px"><span class="sk" style="width:96px;height:34px;border-radius:9px"></span><span class="sk" style="width:96px;height:34px;border-radius:9px"></span></div>' +
      '<span class="sk" style="display:block;width:120px;height:90px;border-radius:10px;margin-top:12px"></span></div>';
  }
  if (q) {
    resBox.innerHTML = skelRow() + skelRow() + skelRow() + skelRow();
    countEl.textContent = '（搜索中…）';
  }
  // 2026-10-21 v3：小索引已内联进本页（window.MRHX_TITLES），零请求秒出标题结果；
  // 补全按需拉命中分片；0 标题命中走全库兜底（拉全部分片）
  (function () {
    var TITLES = window.MRHX_TITLES || [];
    var hits = TITLES.filter(function (g) {
      return fuzzyMatch(g.title, kw) || fuzzyMatch(g.plat, kw);
    });
    if (!hits.length) {
      countEl.textContent = '（全库检索中…）';
      resBox.innerHTML = '<div class="empty-box"><h3>正在全库检索「' + esc(kw) + '」…</h3><p>标题没有直接命中，正在搜索完整介绍</p></div>';
      loadShards(Array.from({length: SHARDS}, function (_, i) { return i; })).then(runFullSearch).catch(showErr);
      return;
    }
    hits.sort(function (a, b) { return matchScore(a) - matchScore(b); });
    hits.forEach(function (g) { g._exact = matchScore(g) <= 1; g._partial = true; });
    _hits = hits;
    countEl.textContent = '（找到 ' + _hits.length + ' 个）';
    _page = 0;
    resBox.innerHTML = '';
    renderMore();
    // 结果已先出，只拉命中条目所在分片补全（失败则保持标题卡片，不报错）
    var ps = [];
    _hits.forEach(function (h) { if (ps.indexOf(h.p || 0) < 0) ps.push(h.p || 0); });
    loadShards(ps).then(enrichWithFull).catch(function () {});
  })();
  function bindHistClick() {
    var delBtns = document.querySelectorAll('.hist-tag .del');
    delBtns.forEach(function (el) {
      el.onclick = function (e) {
        e.preventDefault(); e.stopPropagation();
        var kw = el.getAttribute('data-kw');
        var h = getHist().filter(function (v) { return v !== kw; });
        try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); } catch(e) {}
        el.parentElement.remove();
      };
    });
    var clearBtn = document.getElementById('clear-hist');
    if (clearBtn) clearBtn.onclick = function () { clearHist(); var c = document.querySelector('.search-hist'); if (c) c.remove(); };
  }
  bindHistClick();
})();
</script>
<div class="mrhx-detail" id="mrhxSD"><div class="mrhx-detail-box"><button type="button" class="mrhx-detail-close" id="mrhxSDClose" aria-label="关闭">✕</button><h2 id="mrhxSDTitle"></h2><div class="mrhx-detail-cover"></div><div class="mrhx-detail-from"><b>游戏介绍</b></div><div class="mrhx-detail-text" id="mrhxSDText"></div><div class="mrhx-detail-codes"></div><button type="button" class="mrhx-detail-back" id="mrhxSDBack">返回</button></div></div>
<script>
(function(){
  var d = document.getElementById('mrhxSD'); if (!d) return;
  var ti = document.getElementById('mrhxSDTitle'), tx = document.getElementById('mrhxSDText');
  var box = d.querySelector('.mrhx-detail-box'), cd = d.querySelector('.mrhx-detail-codes'), cv = d.querySelector('.mrhx-detail-cover');
  function closePop() { d.classList.remove('show'); document.body.style.overflow = ''; }
  // 2026-10-15：滚到最底部时抖一下，提醒已经到底了（450ms 冷却防连触）
  var lastBump = 0;
  box.addEventListener('scroll', function () {
    if (box.scrollTop + box.clientHeight >= box.scrollHeight - 2) {
      var now = Date.now();
      if (now - lastBump < 450) return;
      lastBump = now;
      box.classList.remove('mrhx-bump');
      void box.offsetWidth;
      box.classList.add('mrhx-bump');
    }
  });
  document.addEventListener('click', function(e){
    var im = e.target && e.target.closest ? e.target.closest('.s-img') : null;
    if (im) {
      ti.textContent = im.getAttribute('data-t') + (im.getAttribute('data-p') ? ' [' + im.getAttribute('data-p') + ']' : '');
      tx.textContent = im.getAttribute('data-i') || '（暂无介绍）';
      if (cv) {
        cv.innerHTML = '';
        var _ci = document.createElement('img'); _ci.src = im.getAttribute('data-full') || im.getAttribute('src') || ''; _ci.alt = '';
        if (_ci.src) cv.appendChild(_ci);
      }
      if (cd) {
        cd.innerHTML = '';
        var _u = im.getAttribute('data-u'), _c = im.getAttribute('data-c'), _z = im.getAttribute('data-z');
        if (_u) cd.insertAdjacentHTML('beforeend', '<button type="button" class="mrhx-unzip" data-code="' + _u + '">解压码</button>');
        if (_c) cd.insertAdjacentHTML('beforeend', '<button type="button" class="mrhx-cheat" data-code="' + _c + '">作弊码</button>');
        if (_z) cd.insertAdjacentHTML('beforeend', '<button type="button" class="mrhx-sponsor" data-code="' + _z + '">赞助码</button>');
      }
      d.classList.add('show');
      document.body.style.overflow = 'hidden';
      return;
    }
    if (e.target === d || e.target.id === 'mrhxSDClose' || e.target.id === 'mrhxSDBack') closePop();
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closePop(); });
})();
</script>
