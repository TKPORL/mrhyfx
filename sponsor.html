.thanks .tstep{font-size:14px;color:#444;line-height:1.85;padding-left:15px;position:relative;margin-bottom:9px}
.thanks .tstep:last-child{margin-bottom:0}
.thanks .tstep::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:#e5484d}
footer{border-top:1px solid #ecebe9;padding:24px 20px;text-align:center;color:#999;font-size:12px}
