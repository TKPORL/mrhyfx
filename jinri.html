<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#333}
a{text-decoration:none;color:inherit}
#pw{position:fixed;inset:0;z-index:99999;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#pw-box{padding:36px 40px;border-radius:14px;border:1px solid #e0e0e0;max-width:320px;width:90%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06)}
#pw-box h2{font-size:17px;margin-bottom:4px;font-weight:700}
#pw-box p{font-size:13px;color:#999;margin-bottom:20px}
#pw-input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px;text-align:center;letter-spacing:4px;outline:none;font-family:inherit}
#pw-input:focus{border-color:#e5484d}
#pw-btn{width:100%;margin-top:12px;padding:10px 0;border:none;border-radius:8px;background:#e5484d;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#pw-btn:hover{background:#c93a3f}
#pw-err{font-size:13px;color:#e5484d;display:none;margin-top:8px}
noscript #noscript-msg{display:block;background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:28px;text-align:center;color:#999;font-size:14px}
#noscript-msg{display:none}
#app{display:none;max-width:680px;margin:0 auto;padding:40px 20px 60px}
h1{font-size:20px;font-weight:700;margin-bottom:4px}
.subtitle{font-size:13px;color:#aaa;margin-bottom:28px}
.section{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:18px 20px;margin-bottom:12px}
.section h3{font-size:14px;font-weight:700;margin-bottom:10px;color:#222}
.btn{display:inline-block;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:transform .15s,box-shadow .15s,min-width:120px;text-align:center}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.btn-red{background:#e5484d;color:#fff}
.btn-blue{background:#3da8f5;color:#fff}
.btn-green{background:#75c940;color:#fff}
.btn-purple{background:#797ec9;color:#fff}
.txt{font-size:13px;color:#555;line-height:1.8;margin-top:8px}
.txt a{color:#e5484d;font-weight:600}
.note{font-size:12px;color:#aaa;margin-top:8px;line-height:1.7}
.qq{color:#e58d0a;font-weight:700}
ul{padding-left:18px;font-size:13px;color:#555;line-height:2}
.fade{animation:fu .35s ease both}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade:nth-child(2){animation-delay:.05s}
.fade:nth-child(3){animation-delay:.1s}
.fade:nth-child(4){animation-delay:.15s}
.fade:nth-child(5){animation-delay:.2s}
.fade:nth-child(6){animation-delay:.25s}
.fade:nth-child(7){animation-delay:.3s}
.fade:nth-child(8){animation-delay:.35s}
.fade:nth-child(9){animation-delay:.4s}
footer{margin-top:32px;text-align:center;font-size:11px;color:#bbb}
</style>
</head>
<body>

<div id="pw">
  <div id="pw-box">
    <h2>🔒 密码保护</h2>
    <p>请输入密码查看内容</p>
    <input id="pw-input" type="password" placeholder="输入密码…" autocomplete="off" maxlength="20">
    <button id="pw-btn">进入</button>
    <div id="pw-err">密码错误，请重试</div>
  </div>
  <noscript><div id="noscript-msg">本页面需要 JavaScript 支持，请开启后刷新。</div></noscript>
</div>

<div id="app"></div>

<script>
(function(){
  /* UA 检测 → 清空页面 */
  var ua = navigator.userAgent||'';
  if(/Baiduspider|Googlebot|bingbot|Slurp|DuckDuckBot|YandexBot|Baiduspider-BROWSER/i.test(ua)){
    document.documentElement.innerHTML='';return;
  }
  /* 密码门 */
  var PW='2255';
  if(localStorage.getItem('_rp')!=='1'){
    var inp=document.getElementById('pw-input'),btn=document.getElementById('pw-btn'),err=document.getElementById('pw-err');
    function chk(){
      if(inp.value===PW){
        document.getElementById('pw').style.display='none';
        document.getElementById('app').style.display='block';
        localStorage.setItem('_rp','1');
      }else{err.style.display='block';inp.value='';inp.focus();}
    }
    btn.addEventListener('click',chk);
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')chk();});
    return;
  }
  document.getElementById('pw').style.display='none';
  document.getElementById('app').style.display='block';
})();
</script>
