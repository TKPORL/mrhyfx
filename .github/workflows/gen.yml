name: auto-gen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 运行生成脚本
        run: |
          node scripts/gen.js
          node scripts/gen-game.js

      - name: 提交生成结果
        run: |
          git config user.name "mrhx-bot"
          git config user.email "mrhx-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: 自动生成首页与每日页"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          git rebase --abort 2>/dev/null || true
          git reset --hard origin/main 2>/dev/null || true
          echo "❌ 自动生成提交推送上限重试仍未成功"
          exit 1
